name: scan

on:
  schedule:
    # Every 5 minutes, offset to :02/:07/… because GitHub delays or drops runs at busy :00 marks.
    # Runs may still start late; the bot catches up by candle time.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Who started the run (cron-job.org sends "cron"; clicks keep "manual")
        default: manual

permissions:
  contents: write

# One run at a time. GitHub keeps at most one pending run and cancels older pending ones;
# that is harmless because every run replays from saved state.
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check out state branch
        run: |
          git clone -q --depth 1 --branch bot-state "https://github.com/${GITHUB_REPOSITORY}.git" state \
            || { mkdir -p state && git -C state init -q -b bot-state; }

      # Quiet hours (forex weekend or outside every session, no forex/GER40 trade open; only BTCUSD 1H can alert):
      # run once an hour from hh:01, and on every later trigger until that hour's run succeeds. Manual runs always run.
      # Uses the runner's built-in Node; scripts/due.js needs no npm packages.
      - name: Check if a run is due
        id: due
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.source != 'cron' }}
        run: |
          if [ "$MANUAL" = "true" ] || node scripts/due.js state/state.json; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v5
        if: ${{ steps.due.outputs.run == 'true' }}
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
        if: ${{ steps.due.outputs.run == 'true' }}

      # Stays awake ~4 minutes and checks every minute, so alerts and button replies arrive within
      # about a minute instead of 5–15. State is pushed after every pass, so a cancelled job loses nothing.
      # In quiet hours it stops after the first successful pass.
      - name: Run bot
        if: ${{ steps.due.outputs.run == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TV_SESSION: ${{ secrets.TV_SESSION }}
          TV_SIGNATURE: ${{ secrets.TV_SIGNATURE }}
          STATE_PATH: state/state.json
          RUN_SOURCE: ${{ inputs.source }}
          GH_TOKEN: ${{ github.token }}
        run: |
          end=$((SECONDS + 240)); rc=0
          while :; do
            node src/run.js || rc=1
            bash scripts/save-state.sh || rc=1
            [ $SECONDS -ge $end ] && break
            node scripts/due.js state/state.json || break # quiet hours: this hour is done
            export RUN_SOURCE=cron # "Manual run OK" only on the first pass
            sleep $(( (65 - $(date +%s) % 60) % 60 + 1 )) # just after the next 1m candle closes
          done
          exit $rc

      - name: Save state
        if: ${{ failure() && steps.due.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/save-state.sh

      - name: Keep schedule alive
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -lt $(( 30 * 86400 )) ]; then exit 0; fi
          date -u +%FT%TZ > .keepalive
          git add .keepalive
          git -c user.name=nowick-bot -c user.email=nowick-bot@users.noreply.github.com commit -q -m "chore: keep schedule alive"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

      - name: Report failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ No-wick bot run failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
